services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-analytics-postgres

    environment:
      POSTGRES_DB: ai_analytics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  minio:
    image: minio/minio
    container_name: ai-analytics-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ai_admin
      MINIO_ROOT_PASSWORD: change_this_minio_password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: